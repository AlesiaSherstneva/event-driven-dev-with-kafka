spring.kafka.producer.bootstrap-servers=${spring.embedded.kafka.brokers}
spring.kafka.producer.transaction-id-prefix=transfer-service-${random.value}-

spring.kafka.consumer.properties.spring.json.trusted.packages=com.develop.payments.events
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.deposit-group-id=amount-deposit-event
spring.kafka.consumer.withdraw-group-id=amount-withdrawal-event

deposit-topic-name=deposit-money-topic
withdraw-topic-name=withdraw-money-topic